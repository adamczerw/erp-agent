[project]
name = "erp-agent"
version = "0.1.0"
description = "GUI agent for ERP process automation (Dolibarr), built on OpenAdapt"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam Czerwonski", email = "czerwonskiadam@gmail.com" }]
dependencies = [
    "openadapt-evals",
    "openadapt-grounding>=0.1.2",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_agent"]

[tool.uv.sources]
openadapt-evals = { path = "../openadapt-all/openadapt-evals", editable = true }
openadapt-grounding = { path = "../openadapt-all/openadapt-grounding", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
